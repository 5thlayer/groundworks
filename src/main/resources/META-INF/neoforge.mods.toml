modLoader = "javafml"
loaderVersion = "[4,)"
issueTrackerURL = "https://github.com/5thlayer/groundworks/issues"
license = "MIT"

[[mods]]
modId = "groundworks"
version = "${version}"
displayName = "Groundworks"
authors = "5thlayer"
description = '''
A library for mass placement and Dismantle: it plans what a click would lay or take up, shows the plan before the click, and carries it out, for the mods that plan through it.
'''

# The look a placement reads, turned by Rotate, and where it goes, moved by Raise and Lower.
[[mixins]]
config = "groundworks.mixins.json"

[[dependencies.groundworks]]
modId = "neoforge"
type = "required"
versionRange = "[26.1.2.77,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.groundworks]]
modId = "minecraft"
type = "required"
versionRange = "[26.1.2]"
ordering = "NONE"
side = "BOTH"
