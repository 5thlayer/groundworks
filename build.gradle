// ModDevGradle on Java 25, the game test server that names each test, the jar's licensing, ~/.m2-only
// publishing and the release and upload tasks come from the libworks convention plugin (libworks ADR 0003).
plugins {
    id 'io.github.5thlayer.libworks.module' version '0.4.4'
}

// Groundworks requires no other Module.
libworks {
    // Groundworks' own tags are v<version>, which its Consumers' CI builds from.
    tagPrefix = 'v'
}

neoForge {
    // Game types on the test classpath, not a booted game: the tests are of rules that read no
    // registry, so a plan's blocks can be positions with no state.
    addModdingDependenciesTo sourceSets.test
}

// Jade, through CurseForge's maven: Groundworks reads a footprint's part as its origin in Jade's
// tooltip, and runs without it.
repositories {
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    // Jade finds the footprint plugin by its annotation, so the Module runs without it.
    compileOnly 'curse.maven:jade-324717:8651070'
}
