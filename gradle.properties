# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Mod properties. The build, the mods.toml and the scripts read the Library's names from here; the
# Java package, MOD_ID and settings.gradle spell mod_id too.
mod_id = groundworks
mod_name = Groundworks
mod_description = A library for mass placement and Dismantle: it plans what a click would lay or take up, shows the plan before the click, and carries it out, for the mods that plan through it.
mod_version = 0.5.0
maven_group = io.github.5thlayer
archives_name = groundworks

# Minecraft properties
minecraft_version = 26.1.2

# Dependencies
neoforge_version = 26.1.2.77
