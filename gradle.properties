# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Mod properties. The build, the mods.toml and the scripts read the Library's names from here; the
# Java package, MOD_ID and settings.gradle spell mod_id too.
mod_id = groundworks
mod_name = Groundworks
mod_description = Place whole lines of blocks in one drag, preview every placement before you click, rotate, raise and lower it, and take lines back up with one Dismantle, all in vanilla.
mod_version = 0.5.5
maven_group = io.github.5thlayer
archives_name = groundworks

# Minecraft properties
minecraft_version = 26.1.2

# Dependencies
neoforge_version = 26.1.2.77

# Modrinth and CurseForge (ADR 0007). The dependencies are the required ones, comma separated:
# Modrinth project ids, CurseForge slugs. Groundworks has none.
# upload_release_type is release, beta or alpha for every upload, or empty for beta below 1.0 and
# release from it; CurseForge's app lists a project only once it has a release.
modrinth_project_id = AJ3Q7hSr
curseforge_project_id = 1717892
modrinth_dependencies =
curseforge_dependencies =
upload_release_type = release
